<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내가 만든 핸드폰</title>
<style>
  :root { --bg:#dfe9e3; --body:#1d2b26; --screen:#f4f7f5; --accent:#2f9e78; --ink:#16201c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); font-family:"Noto Sans KR",system-ui,sans-serif; }

  /* 핸드폰 몸체 */
  .phone { width:300px; height:600px; background:var(--body); border-radius:42px; padding:12px; box-shadow:0 20px 40px rgba(0,0,0,.25); }
  .screen { position:relative; width:100%; height:100%; background:var(--screen); border-radius:32px; overflow:hidden; color:var(--ink); }
  .status { display:flex; justify-content:space-between; padding:12px 22px 0; font-size:13px; font-weight:700; }

  /* 홈 화면 */
  .home { display:grid; grid-template-columns:repeat(3,1fr); gap:22px 8px; padding:36px 20px; }
  .app { background:none; border:0; font:inherit; font-size:12px; color:var(--ink); cursor:pointer; }
  .icon { display:block; width:56px; height:56px; margin:0 auto 6px; border-radius:16px; font-size:28px; line-height:56px; background:var(--accent); }
  .app:nth-child(2) .icon { background:#e8a33d; }
  .app:nth-child(3) .icon { background:#5b8def; }

  /* 앱 화면 */
  .view { position:absolute; inset:0; top:34px; background:var(--screen); padding:16px 20px; display:none; flex-direction:column; }
  .view.open { display:flex; }
  .back { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); width:110px; height:6px; border:0; border-radius:3px; background:var(--body); cursor:pointer; }
  h2 { margin:0 0 14px; font-size:18px; }

  /* 시계 */
  #clock { font-size:44px; font-weight:700; margin-top:70px; text-align:center; }
  #date { text-align:center; color:#667; margin-top:6px; }

  /* 계산기 */
  #display { background:#fff; border-radius:12px; padding:14px; text-align:right; font-size:28px; min-height:60px; margin-bottom:12px; overflow:hidden; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .keys button { height:46px; border:0; border-radius:12px; font-size:18px; background:#fff; cursor:pointer; }
  .keys button.op { background:var(--accent); color:#fff; }

  /* 메모 */
  textarea { flex:1; border:0; border-radius:12px; padding:12px; font:inherit; resize:none; margin-bottom:24px; }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <div class="status"><span id="statusTime">--:--</span><span>🔋 100%</span></div>

    <!-- 홈 화면: 앱을 추가하려면 버튼을 하나 더 만들면 돼요 -->
    <div class="home">
      <button class="app" data-open="clockView"><span class="icon">🕒</span>시계</button>
      <button class="app" data-open="calcView"><span class="icon">🧮</span>계산기</button>
      <button class="app" data-open="memoView"><span class="icon">📝</span>메모</button>
    </div>

    <div class="view" id="clockView">
      <h2>시계</h2>
      <div id="clock">--:--:--</div>
      <div id="date"></div>
      <button class="back" aria-label="홈으로"></button>
    </div>

    <div class="view" id="calcView">
      <h2>계산기</h2>
      <div id="display">0</div>
      <div class="keys" id="keys"></div>
      <button class="back" aria-label="홈으로"></button>
    </div>

    <div class="view" id="memoView">
      <h2>메모</h2>
      <textarea id="memo" placeholder="여기에 적어보세요"></textarea>
      <button class="back" aria-label="홈으로"></button>
    </div>
  </div>
</div>

<script>
  // 앱 열기 / 홈으로 돌아가기
  document.querySelectorAll('[data-open]').forEach(btn => {
    btn.onclick = () => document.getElementById(btn.dataset.open).classList.add('open');
  });
  document.querySelectorAll('.back').forEach(btn => {
    btn.onclick = () => btn.parentElement.classList.remove('open');
  });

  // 시계: 1초마다 현재 시간을 바꿔요
  function tick() {
    const now = new Date();
    document.getElementById('statusTime').textContent = now.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
    document.getElementById('clock').textContent = now.toLocaleTimeString('ko-KR', {hour12:false});
    document.getElementById('date').textContent = now.toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric', weekday:'long'});
  }
  tick(); setInterval(tick, 1000);

  // 계산기
  const display = document.getElementById('display');
  const labels = ['7','8','9','÷','4','5','6','×','1','2','3','−','C','0','=','+'];
  let text = '';
  labels.forEach(label => {
    const b = document.createElement('button');
    b.textContent = label;
    if ('÷×−+='.includes(label)) b.className = 'op';
    b.onclick = () => {
      if (label === 'C') text = '';
      else if (label === '=') {
        try { text = String(eval(text.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-'))); }
        catch { text = '오류'; }
      } else text += label;
      display.textContent = text || '0';
    };
    document.getElementById('keys').appendChild(b);
  });
</script>
</body>
</html>
