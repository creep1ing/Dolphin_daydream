<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolphin's iPhone</title>
<style>
  :root { --screen:#f2f2f7; --ink:#111; --blue:#0a84ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#cfd8dc; font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; user-select:none; }

  .phone { position:relative; width:310px; height:640px; background:#111; border-radius:50px; padding:10px; box-shadow:0 0 0 3px #555, 0 24px 50px rgba(0,0,0,.35); }
  .side { position:absolute; right:-6px; top:150px; width:5px; height:80px; background:#555; border-radius:0 3px 3px 0; cursor:pointer; }
  .screen { position:relative; width:100%; height:100%; border-radius:42px; overflow:hidden; color:#fff;
            background:#1b4f8a url(wallpaper.jpg) center/cover; }   /* ← 배경화면 사진 */
  .island { position:absolute; top:10px; left:50%; transform:translateX(-50%); width:90px; height:26px; background:#000; border-radius:13px; z-index:30; }
  .status { position:absolute; top:12px; left:0; right:0; display:flex; justify-content:space-between; padding:0 26px; font-size:13px; font-weight:600; z-index:25; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.3); }
  .screen.dark .status { color:var(--ink); text-shadow:none; }

  /* 잠금화면 (같은 사진을 써요) */
  .lock { position:absolute; inset:0; z-index:20; transition:transform .45s ease; display:flex; flex-direction:column; align-items:center; background:url(wallpaper.jpg) center/cover; text-shadow:0 2px 10px rgba(0,0,0,.35); }
  .lock.open { transform:translateY(-100%); }
  #lDate { margin-top:70px; font-size:17px; font-weight:600; }
  #lTime { font-size:84px; font-weight:700; line-height:1; letter-spacing:-2px; }
  .tools { position:absolute; bottom:70px; left:0; right:0; display:flex; justify-content:space-between; padding:0 34px; }
  .circle { width:46px; height:46px; border-radius:50%; background:rgba(0,0,0,.35); display:grid; place-items:center; font-size:20px; backdrop-filter:blur(10px); }
  .hint { position:absolute; bottom:22px; font-size:12px; }
  .bar { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:110px; height:5px; border-radius:3px; background:#fff; z-index:28; cursor:pointer; }
  .screen.dark .bar { background:#111; }

  /* 홈 화면 */
  .home { display:grid; grid-template-columns:repeat(4,1fr); gap:20px 4px; padding:64px 14px; align-content:start; }
  .app { background:none; border:0; color:#fff; font:inherit; font-size:11px; cursor:pointer; text-shadow:0 1px 3px rgba(0,0,0,.45); }
  .icon { display:block; width:54px; height:54px; margin:0 auto 5px; border-radius:13px; object-fit:cover; box-shadow:0 2px 6px rgba(0,0,0,.25); }

  /* 앱 공통 */
  .view { position:absolute; inset:0; z-index:15; background:var(--screen); color:var(--ink); padding:54px 16px 30px; display:flex; flex-direction:column; transform:scale(.85); opacity:0; pointer-events:none; transition:.25s ease; border-radius:42px; overflow:hidden; }
  .view.open { transform:none; opacity:1; pointer-events:auto; }
  .page { display:none; flex-direction:column; flex:1; min-height:0; }
  .page.on { display:flex; }
  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  h2 { margin:0; font-size:26px; }
  .link { background:none; border:0; color:var(--blue); font:inherit; font-size:16px; cursor:pointer; padding:4px; }
  .list { flex:1; overflow-y:auto; background:#fff; border-radius:14px; user-select:text; }
  .row { display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid #eee; padding:11px 14px; font:inherit; color:var(--ink); cursor:pointer; }
  .row b { display:block; font-size:15px; }
  .row span { display:block; font-size:13px; color:#777; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* 메시지 */
  .chat { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:6px 0; }
  .bub { max-width:75%; padding:8px 12px; border-radius:18px; font-size:14px; background:#e5e5ea; align-self:flex-start; user-select:text; }
  .bub.me { background:var(--blue); color:#fff; align-self:flex-end; }

  /* 알람 */
  .alarm { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid #eee; }
  .alarm .t { font-size:34px; font-weight:300; }
  .alarm small { color:#777; display:block; font-size:12px; }
  .sw { width:48px; height:28px; border-radius:14px; background:#ccc; position:relative; border:0; cursor:pointer; }
  .sw::after { content:""; position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:#fff; transition:.2s; }
  .sw.on { background:#34c759; } .sw.on::after { left:22px; }

  /* 메모 입력 */
  input, textarea { width:100%; border:0; border-radius:12px; padding:12px; font:inherit; background:#fff; user-select:text; margin-bottom:10px; }
  textarea { flex:1; resize:none; }

  /* 상태바 */
  .sr { display:flex; align-items:center; gap:5px; }
  .batt { position:relative; width:24px; height:12px; border:1.5px solid currentColor; border-radius:4px; padding:1px; }
  .batt i { display:block; width:80%; height:100%; background:currentColor; border-radius:2px; }
  .batt::after { content:""; position:absolute; right:-4px; top:3px; width:2px; height:4px; background:currentColor; border-radius:0 2px 2px 0; }
  /* 잠금화면 아이콘 / 알림 */
  .circle { color:#fff; cursor:pointer; } .circle.on { background:#fff; color:#111; }
  .notifs { position:absolute; top:196px; left:12px; right:12px; display:flex; flex-direction:column; gap:8px; }
  .notif { display:flex; gap:10px; padding:10px 12px; border-radius:20px; background:rgba(25,45,85,.45); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); font-size:12px; text-shadow:none; }
  .notif img { width:34px; height:34px; border-radius:8px; } .notif div { flex:1; } .notif b { display:block; font-size:13px; } .notif small { opacity:.75; }
  /* 비밀번호 */
  .pad { position:absolute; inset:0; z-index:2; display:none; flex-direction:column; align-items:center; padding-top:80px; background:rgba(0,0,0,.28); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
  .pad.show { display:flex; } .ptitle { font-size:17px; font-weight:600; }
  .dots { display:flex; gap:16px; margin:22px 0 26px; } .dots i { width:12px; height:12px; border-radius:50%; border:1.5px solid #fff; } .dots i.f { background:#fff; }
  .dots.shake { animation:sh .35s; } @keyframes sh { 20%,60% { transform:translateX(-10px); } 40%,80% { transform:translateX(10px); } }
  .pkeys { display:grid; grid-template-columns:repeat(3,64px); gap:14px; }
  .pkeys button { width:64px; height:64px; border-radius:50%; border:0; background:rgba(255,255,255,.22); color:#fff; font-size:26px; cursor:pointer; } .pkeys .e { background:none; font-size:20px; }
  .pcancel { margin-top:18px; background:none; border:0; color:#fff; font:inherit; cursor:pointer; }
  /* 전화 */
  .num { font-size:34px; text-align:center; min-height:46px; margin-top:24px; font-weight:300; overflow:hidden; }
  .callmsg { text-align:center; color:#666; font-size:13px; min-height:20px; margin-bottom:10px; }
  .dial { display:grid; grid-template-columns:repeat(3,66px); gap:12px; justify-content:center; }
  .dial button { width:66px; height:66px; border-radius:50%; border:0; background:#e3e3e8; font-size:28px; cursor:pointer; color:var(--ink); }
  .dial .call { background:#34c759; color:#fff; display:grid; place-items:center; } .dial .e { background:none; font-size:22px; }
  .tabs { display:flex; border-top:1px solid #ddd; margin:8px -16px -4px; padding-top:4px; }
  .tabs button { flex:1; background:none; border:0; font:inherit; font-size:12px; color:#888; padding:6px; } .tabs button.on { color:var(--blue); font-weight:700; }
  /* 캘린더 */
  .calicon { background:#fff; color:#111; text-align:center; line-height:1; padding-top:6px; }
  .calicon small { display:block; font-size:11px; color:#ff3b30; font-weight:700; margin-bottom:1px; } .calicon b { display:block; font-size:26px; font-weight:300; margin-top:2px; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; font-size:14px; background:#fff; border-radius:14px; padding:8px 4px; }
  .cal .w { color:#888; font-size:11px; padding:4px 0; }
  .cal button { border:0; background:none; font:inherit; height:34px; border-radius:50%; cursor:pointer; color:var(--ink); position:relative; }
  .cal button.today { background:#ff3b30; color:#fff; } .cal button.sel { outline:2px solid var(--blue); }
  .cal button.ev::after { content:""; position:absolute; bottom:2px; left:50%; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:#ff9f0a; }

  /* 독 + 부드러운 전환 */
  .dock { position:absolute; left:10px; right:10px; bottom:22px; display:grid; grid-template-columns:repeat(4,1fr); padding:12px 10px; border-radius:30px; background:rgba(255,255,255,.28); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
  .dock .icon { margin:0 auto; }
  .home, .dock { transition:transform .6s cubic-bezier(.22,.8,.2,1), opacity .5s ease; }
  .screen.locked .home, .screen.locked .dock { transform:scale(.9); opacity:0; }
  .lock { transition:transform .6s cubic-bezier(.22,.8,.2,1), opacity .5s ease; }
  .lock.open { transform:translateY(-100%); opacity:0; }
  .pad { display:flex; opacity:0; pointer-events:none; transition:opacity .35s ease; } .pad.show { opacity:1; pointer-events:auto; }
  .view { transition:transform .4s cubic-bezier(.22,.8,.2,1), opacity .3s ease; }
  .app:active .icon { transform:scale(.92); } .icon { transition:transform .15s; }
</style>
</head>
<body>

<div class="phone">
  <div class="side" id="sideBtn" title="잠금"></div>
  <div class="screen locked" id="screen">
    <div class="island"></div>
    <div class="status"><span id="sTime">9:41</span><span class="sr"><svg viewBox="0 0 18 12" width="18" height="12" fill="currentColor"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg>5G<span class="batt"><i></i></span></span></div>

    <!-- 홈 화면 -->
    <div class="home">
      <button class="app" data-open="calView"><div class="icon calicon"><small id="calDow"></small><b id="calDay"></b></div>캘린더</button>
    </div>
    <div class="dock">
      <button class="app" data-open="telView" aria-label="전화"><img class="icon" src="phone.png" alt=""></button>
      <button class="app" data-open="msgView" aria-label="메시지"><img class="icon" src="message.png" alt=""></button>
      <button class="app" data-open="almView" aria-label="시계"><img class="icon" src="clock.png" alt=""></button>
      <button class="app" data-open="memoView" aria-label="메모"><img class="icon" src="memo.png" alt=""></button>
    </div>

    <!-- 메시지 -->
    <div class="view" id="msgView">
      <div class="page on" id="msgList"><div class="head"><h2>메시지</h2></div><div class="list" id="threads"></div></div>
      <div class="page" id="msgThread"><div class="head"><button class="link" id="msgBack">‹ 목록</button><b id="msgName"></b><span style="width:50px"></span></div><div class="chat" id="chat"></div></div>
    </div>

    <!-- 전화번호 -->
    <div class="view" id="telView">
      <div class="page on" id="telKeys"><div class="num" id="dialNum"></div><div class="callmsg" id="callMsg"></div><div class="dial" id="dial"></div></div>
      <div class="page" id="telContacts"><div class="head"><h2>연락처</h2><button class="link" id="ctAdd">＋</button></div><div class="list" id="contacts"></div></div>
      <div class="page" id="telNew"><div class="head"><button class="link" id="ctCancel">취소</button><button class="link" id="ctSave"><b>저장</b></button></div><input id="cName" placeholder="이름"><input id="cNum" placeholder="전화번호" inputmode="tel"></div>
      <div class="tabs"><button data-p="telKeys" class="on">키패드</button><button data-p="telContacts">연락처</button></div>
    </div>

    <!-- 알람 -->
    <div class="view" id="almView"><div class="head"><h2>알람</h2></div><div class="list" id="alarms"></div></div>

    <!-- 메모 -->
    <div class="view" id="memoView">
      <div class="page on" id="memoList"><div class="head"><h2>메모</h2><button class="link" id="memoAdd">＋ 새 메모</button></div><div class="list" id="memos"></div></div>
      <div class="page" id="memoRead"><div class="head"><button class="link" id="readBack">‹ 목록</button><span></span></div><h2 id="readTitle" style="font-size:22px;margin-bottom:10px"></h2><div class="list" id="readBody" style="padding:14px;white-space:pre-wrap"></div></div>
      <div class="page" id="memoNew"><div class="head"><button class="link" id="newCancel">취소</button><button class="link" id="newSave"><b>저장</b></button></div><input id="nTitle" placeholder="제목"><textarea id="nBody" placeholder="내용을 적어보세요"></textarea></div>
    </div>

    <div class="view" id="calView">
      <div class="head"><button class="link" id="cPrev">‹</button><h2 id="cTitle" style="font-size:20px"></h2><button class="link" id="cNext">›</button></div>
      <div class="cal" id="calGrid"></div>
      <div class="list" id="calEv" style="flex:none;min-height:120px;margin-top:10px"></div>
    </div>

    <!-- 잠금화면 -->
    <div class="lock" id="lock">
      <div id="lDate"></div><div id="lTime">9:41</div>
      <div class="notifs" id="notifs"></div>
      <div class="tools">
        <div class="circle" id="flash"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 2h10v5l-2 2v12a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V9L7 7z"/><rect x="11" y="12" width="2" height="3" rx="1" fill="#000" opacity=".45"/></svg></div>
        <div class="circle" id="cam"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M9 4 7.2 6H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4z"/><circle cx="12" cy="13" r="4" fill="#000" opacity=".45"/></svg></div>
      </div>
      <div class="hint">위로 밀어서 열기</div>
      <div class="pad" id="pad"><div class="ptitle">암호 입력</div><div class="dots" id="dots"></div><div class="pkeys" id="pkeys"></div><button class="pcancel" id="pcancel">취소</button></div>
    </div>

    <div class="bar" id="homeBar" title="홈"></div>
  </div>
</div>

<script>
  /* ====== 내용은 여기서 바꿔요! (연습용 가짜 데이터예요) ====== */
  const THREADS = [
    { name:'산양 사원님',   msgs:[ ['me','산양님 식사 하셨나여?'], ['me','저랑 전복비빔밥 같이 먹어여! 제가 사드릴게여.'], ['them','네 알겠습니다...!'] ] },
    { name:'나비 대리님', msgs:[ ['them','왜 전화했어?'], ['me','대리님이 제 부탁 들어주신다구 하셨잖아여?'], ['me','오늘 착한 일 하고 저한테 알려주세여!'], ['them','야'] ] },
    { name:'010-0192-0829',   msgs:[ ['them','오 안녕하세요 사원님ㅋㅋㅋ'] ] },
  ];
  const CONTACTS = [
    { name:'나비 대리님', num:'010-0110-1228' },
    { name:'산양 사원님', num:'010-0298-0324' },
    { name:'조랑말 주임님', num:'010-0272-0218' },
    { name:'송골매 대리님', num:'010-0243-1004' },
    { name:'C조 과장님', num:'010-1234-5678' },
  ];
  const ALARMS = [
    { time:'06:30', label:'출근', on:true },
  ];
  const DEFAULT_MEMOS = [
    { title:'나쁜 사람!', body:'1. 표범 대리\n2. 무당벌레 사원' },
    { title:'착한 사람!', body:'1. 산양 사원님\n2.세광팀 직원님들\n3. C조 과장님 ' },
  ];

  /* ====== 도구들 ====== */
  const $ = id => document.getElementById(id);
  const screen = $('screen'), lock = $('lock');
  function showPage(view, pageId) { document.querySelectorAll('#'+view+' .page').forEach(p => p.classList.toggle('on', p.id === pageId)); }
  function row(title, sub, onclick) {
    const b = document.createElement('button'); b.className = 'row';
    b.innerHTML = '<b></b><span></span>'; b.children[0].textContent = title; b.children[1].textContent = sub;
    if (onclick) b.onclick = onclick; return b;
  }

  /* ====== 잠금 / 앱 열기 ====== */
  function unlock() { lock.classList.add('open'); screen.classList.remove('locked'); }
  function closeApps() {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('open')); screen.classList.remove('dark');
    showPage('msgView','msgList'); showPage('memoView','memoList'); setTab('telKeys');
  }
  function lockPhone() { closeApps(); $('pad').classList.remove('show'); lock.classList.remove('open'); screen.classList.add('locked'); }
  let startY = null;
  let dragged = false;
  lock.onpointerdown = e => { startY = e.clientY; dragged = false; };
  window.addEventListener('pointermove', e => {          // 손가락을 따라 잠금화면이 올라와요
    if (startY === null) return; const dy = e.clientY - startY;
    if (dy < -6) { dragged = true; lock.style.transition = 'none'; lock.style.transform = 'translateY(' + Math.max(dy, -140) * .6 + 'px)'; }
  });
  window.addEventListener('pointerup', e => {
    if (startY === null) return; const dy = e.clientY - startY; startY = null;
    lock.style.transition = ''; lock.style.transform = ''; if (dy < -50) askCode();
  });
  lock.onclick = () => { if (!dragged) askCode(); };
  $('sideBtn').onclick = lockPhone;
  $('homeBar').onclick = () => lock.classList.contains('open') ? closeApps() : askCode();
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { $(b.dataset.open).classList.add('open'); screen.classList.add('dark'); });

  /* ====== 시간 ====== */
  function tick() {
    const n = new Date();
    const t = n.toLocaleTimeString('ko-KR', {hour:'numeric', minute:'2-digit', hour12:false});
    $('sTime').textContent = t; $('lTime').textContent = t;
    $('calDow').textContent = n.toLocaleDateString('ko-KR', {weekday:'short'}); $('calDay').textContent = n.getDate();
    $('lDate').textContent = n.toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'long'});
  }
  tick(); setInterval(tick, 1000);

  /* ====== 메시지 ====== */
  THREADS.forEach(th => $('threads').appendChild(row(th.name, th.msgs[th.msgs.length-1][1], () => {
    $('msgName').textContent = th.name; $('chat').innerHTML = '';
    th.msgs.forEach(([who, text]) => { const d = document.createElement('div'); d.className = 'bub' + (who === 'me' ? ' me' : ''); d.textContent = text; $('chat').appendChild(d); });
    showPage('msgView','msgThread');
  })));
  $('msgBack').onclick = () => showPage('msgView','msgList');

  /* ====== 전화번호 ====== */
  

  /* ====== 알람 ====== */
  ALARMS.forEach(a => {
    const d = document.createElement('div'); d.className = 'alarm';
    d.innerHTML = '<div><div class="t"></div><small></small></div><button class="sw"></button>';
    d.querySelector('.t').textContent = a.time; d.querySelector('small').textContent = a.label;
    const sw = d.querySelector('.sw'); sw.classList.toggle('on', a.on);
    sw.onclick = () => { a.on = !a.on; sw.classList.toggle('on', a.on); };
    $('alarms').appendChild(d);
  });

  /* ====== 메모 (새 메모는 브라우저에 저장돼요) ====== */
  let memos = DEFAULT_MEMOS;
  try { memos = JSON.parse(localStorage.getItem('memos')) || DEFAULT_MEMOS; } catch (e) {}
  function drawMemos() {
    $('memos').innerHTML = '';
    memos.forEach(m => $('memos').appendChild(row(m.title, m.body.replace(/\n/g,' '), () => {
      $('readTitle').textContent = m.title; $('readBody').textContent = m.body; showPage('memoView','memoRead');
    })));
  }
  drawMemos();
  $('readBack').onclick = () => showPage('memoView','memoList');
  $('memoAdd').onclick = () => { $('nTitle').value = ''; $('nBody').value = ''; showPage('memoView','memoNew'); };
  $('newCancel').onclick = () => showPage('memoView','memoList');
  $('newSave').onclick = () => {
    const title = $('nTitle').value.trim() || '새 메모', body = $('nBody').value.trim();
    memos.unshift({ title, body });
    try { localStorage.setItem('memos', JSON.stringify(memos)); } catch (e) {}
    drawMemos(); showPage('memoView','memoList');
  };

  /* ====== 숫자 비밀번호 ====== */
  // 비밀번호는 아무 숫자 4개나 누르면 열려요
  const NOTIFS = [           // ← 잠금화면 알림도 여기서 바꿔요
    { icon:'message.png', app:'메시지', title:'산양 사원님', text:'네 알겠습니다...!', time:'지금' },
    { icon:'clock.png', app:'시계', title:'알람', text:'출근 시간이에요', time:'3분 전' },
  ];
  let typed = '';
  function drawDots() { $('dots').innerHTML = [0,1,2,3].map(i => '<i class="' + (i < typed.length ? 'f' : '') + '"></i>').join(''); }
  function askCode() { $('pad').classList.add('show'); typed = ''; drawDots(); }
  function checkCode() { $('pad').classList.remove('show'); typed = ''; drawDots(); unlock(); }
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k => {
    const b = document.createElement('button'); b.textContent = k;
    if (k === '') b.style.visibility = 'hidden'; if (k === '⌫') b.className = 'e';
    b.onclick = () => { if (k === '⌫') typed = typed.slice(0,-1); else if (typed.length < 4) typed += k; drawDots(); if (typed.length === 4) setTimeout(checkCode, 150); };
    $('pkeys').appendChild(b);
  });
  $('pad').onclick = e => e.stopPropagation();
  $('pcancel').onclick = () => $('pad').classList.remove('show');
  $('flash').onclick = e => { e.stopPropagation(); $('flash').classList.toggle('on'); };
  $('cam').onclick = e => e.stopPropagation();
  NOTIFS.forEach(n => { const d = document.createElement('div'); d.className = 'notif';
    d.innerHTML = '<img src="' + n.icon + '" alt=""><div><small style="float:right"></small><b></b><span></span></div>';
    d.querySelector('small').textContent = n.time; d.querySelector('b').textContent = n.title; d.querySelector('span').textContent = n.text; $('notifs').appendChild(d); });

  /* ====== 전화: 키패드 + 연락처 추가 ====== */
  let contacts = CONTACTS;
  try { contacts = JSON.parse(localStorage.getItem('contacts')) || CONTACTS; } catch (e) {}
  function setTab(p) { showPage('telView', p); document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.p === p)); }
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.p));
  let dialed = '';
  const digits = s => s.replace(/\D/g, '');
  function findName(n) { const c = contacts.find(c => n && digits(c.num) === digits(n)); return c ? c.name : ''; }
  function drawDial() { $('dialNum').textContent = dialed; $('callMsg').textContent = findName(dialed); }
  ['1','2','3','4','5','6','7','8','9','*','0','#','','call','⌫'].forEach(k => {
    const b = document.createElement('button');
    if (k === '') b.style.visibility = 'hidden';
    else if (k === 'call') { b.className = 'call'; b.innerHTML = '<svg viewBox="0 0 24 24" width="28" height="28" fill="#fff"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.100.4 2.300.6 3.600.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.500c.6 0 1 .4 1 1 0 1.300.2 2.500.6 3.600.1.300 0 .700-.2 1z"/></svg>';
      b.onclick = () => { if (!dialed) return; $('callMsg').textContent = (findName(dialed) || dialed) + '에게 거는 중…'; setTimeout(drawDial, 2500); }; }
    else { b.textContent = k; if (k === '⌫') b.className = 'e'; b.onclick = () => { dialed = k === '⌫' ? dialed.slice(0,-1) : (dialed.length < 15 ? dialed + k : dialed); drawDial(); }; }
    $('dial').appendChild(b);
  });
  function drawContacts() { $('contacts').innerHTML = ''; contacts.forEach(c => $('contacts').appendChild(row(c.name, c.num, () => { dialed = c.num; drawDial(); setTab('telKeys'); }))); }
  drawContacts();
  $('ctAdd').onclick = () => { $('cName').value = ''; $('cNum').value = ''; showPage('telView', 'telNew'); };
  $('ctCancel').onclick = () => setTab('telContacts');
  $('ctSave').onclick = () => {
    const name = $('cName').value.trim(), num = $('cNum').value.trim(); if (!name || !num) return;
    contacts.push({ name, num }); try { localStorage.setItem('contacts', JSON.stringify(contacts)); } catch (e) {}
    drawContacts(); setTab('telContacts');
  };

  /* ====== 캘린더 ====== */
  const EVENTS = {   // ← 일정은 '년-월-일': ['할 일'] 모양으로 추가해요
    '2026-10-21': ['학원 시험'],
    '2026-10-24': ['친구 하나 생일 🎂'],
    '2026-10-31': ['할로윈 파티 🎃'],
  };
  const pad2 = n => String(n).padStart(2, '0');
  const today = new Date();
  let cy = today.getFullYear(), cm = today.getMonth(), sel = cy + '-' + pad2(cm+1) + '-' + pad2(today.getDate());
  function drawCal() {
    const g = $('calGrid'); g.innerHTML = '';
    ['일','월','화','수','목','금','토'].forEach(d => { const w = document.createElement('div'); w.className = 'w'; w.textContent = d; g.appendChild(w); });
    $('cTitle').textContent = cy + '년 ' + (cm+1) + '월';
    for (let i = 0; i < new Date(cy, cm, 1).getDay(); i++) g.appendChild(document.createElement('span'));
    for (let d = 1; d <= new Date(cy, cm+1, 0).getDate(); d++) {
      const key = cy + '-' + pad2(cm+1) + '-' + pad2(d), b = document.createElement('button'); b.textContent = d;
      if (EVENTS[key]) b.classList.add('ev');
      if (d === today.getDate() && cm === today.getMonth() && cy === today.getFullYear()) b.classList.add('today');
      if (key === sel) b.classList.add('sel');
      b.onclick = () => { sel = key; drawCal(); };
      g.appendChild(b);
    }
    $('calEv').innerHTML = ''; const ev = EVENTS[sel] || [];
    if (!ev.length) $('calEv').appendChild(row('일정이 없어요', sel));
    ev.forEach(t => $('calEv').appendChild(row(t, sel)));
  }
  $('cPrev').onclick = () => { cm--; if (cm < 0) { cm = 11; cy--; } drawCal(); };
  $('cNext').onclick = () => { cm++; if (cm > 11) { cm = 0; cy++; } drawCal(); };
  drawCal(); tick();
</script>
</body>
</html>
